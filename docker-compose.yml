services:
  job-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    init: true
    volumes:
      - job-data:/app/data
      - ./config/boards.json:/app/config/boards.json:ro
      - ./config/feeds.json:/app/config/feeds.json:ro
      - ./config/careers.json:/app/config/careers.json:ro
volumes:
  job-data:
