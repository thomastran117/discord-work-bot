name: Canadian new-grad job bot

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose preview, webhook test, normal poll, or backfill current seeded jobs
        type: choice
        default: preview
        options:
          - preview
          - test-webhook
          - poll
          - backfill

permissions:
  contents: read

concurrency:
  group: discord-job-bot-production
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set preview database location
        run: echo "DATABASE_PATH=$RUNNER_TEMP/discord-job-bot/jobs.db" >> "$GITHUB_ENV"
      - name: Restore saved cooldowns (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/workflow-state.sh restore
      - run: npm run preview

  test-webhook:
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'workflow_dispatch' && inputs.mode == 'test-webhook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Send a sample Discord job card
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run test:webhook

  poll:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'poll' || inputs.mode == 'backfill')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      STATE_BRANCH: bot-state
      FIRST_RUN_MODE: ${{ vars.FIRST_RUN_MODE || 'seed' }}
      MAX_NOTIFICATIONS_PER_RUN: ${{ vars.MAX_NOTIFICATIONS_PER_RUN || '25' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set database location
        run: echo "DATABASE_PATH=$RUNNER_TEMP/discord-job-bot/jobs.db" >> "$GITHUB_ENV"
      - name: Restore persistent state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/workflow-state.sh restore
      - name: Fetch jobs and notify Discord
        id: poll
        timeout-minutes: 20
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Set the DISCORD_WEBHOOK_URL repository Actions secret."
            exit 1
          fi
          if [[ "$RUN_MODE" == backfill ]]; then
            npm run backfill
          else
            npm run once
          fi
      - name: Persist state even after a partial failure
        if: always() && steps.restore.outcome == 'success' && steps.poll.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/workflow-state.sh save
