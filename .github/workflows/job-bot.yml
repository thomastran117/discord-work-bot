name: Canadian new-grad job bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Poll for newly discovered jobs, or backfill recent postings
        type: choice
        default: poll
        options:
          - poll
          - backfill
      backfill_days:
        description: Days to look back (1–30; ignored for poll)
        type: number
        required: false
        default: 7

permissions:
  contents: read

concurrency:
  group: discord-job-bot-production
  cancel-in-progress: false

jobs:
  poll:
    if: github.ref_name == github.event.repository.default_branch && (inputs.mode == 'poll' || inputs.mode == 'backfill')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FIRST_RUN_MODE: ${{ vars.FIRST_RUN_MODE || 'seed' }}
      MAX_NOTIFICATIONS_PER_RUN: ${{ vars.MAX_NOTIFICATIONS_PER_RUN || '25' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run shared job (manual)
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_MODE: ${{ inputs.mode }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: bash scripts/run-job.sh "$RUN_MODE" "${BACKFILL_DAYS:-7}"
